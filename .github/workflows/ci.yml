name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.0"
          use-public-rspm: true
      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2
      - name: Verify locked package versions
        run: make check
      - name: Reanalyze the committed attributed snapshot
        if: github.event_name != 'workflow_dispatch'
        run: make test
      - name: Rebuild from the licensed source workbook and reproduce all results
        if: github.event_name == 'workflow_dispatch'
        run: make reproduce
