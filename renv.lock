      "Requirements": ["methods"]
    },
    "lifecycle": {
      "Package": "lifecycle",
      "Version": "1.0.5",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["cli", "R", "rlang"]
    },
    "magrittr": {
      "Package": "magrittr",
      "Version": "2.0.5",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["R"]
