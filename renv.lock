      "Package": "tibble",
      "Version": "3.3.1",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["cli", "lifecycle", "magrittr", "methods", "pillar", "pkgconfig", "R", "rlang", "utils", "vctrs"]
    },
    "utf8": {
      "Package": "utf8",
      "Version": "1.2.6",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["R"]
    },
    "vctrs": {
      "Package": "vctrs",
      "Version": "0.7.3",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["cli", "glue", "lifecycle", "R", "rlang"]
    }
  }
