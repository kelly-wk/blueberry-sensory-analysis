    "prettyunits": {
      "Package": "prettyunits",
      "Version": "1.2.0",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["R"]
    },
    "progress": {
      "Package": "progress",
      "Version": "1.2.3",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["crayon", "hms", "prettyunits", "R", "R6"]
    },
    "R6": {
      "Package": "R6",
      "Version": "2.6.1",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["R"]
    },
    "readxl": {
      "Package": "readxl",
      "Version": "1.4.5",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["cellranger", "cpp11", "progress", "R", "tibble", "utils"]
    },
    "rematch": {
      "Package": "rematch",
      "Version": "2.0.0",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": []
    },
    "rlang": {
      "Package": "rlang",
      "Version": "1.2.0",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": ["R", "utils"]
